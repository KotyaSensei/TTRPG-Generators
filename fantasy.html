    <style>
    body {
      font-family: 'Lora', serif;
      background: url('images/fondnd.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ecf0f1;
      margin: 0 auto; /* Center the content */
      padding: 0;
      max-width: 1440px; /* Set maximum width */
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }
    
    h1 {
      font-size: 2.5rem;
      text-align: center;
      margin: 20px 0;
      color: #f1c40f;
      text-shadow: 0 0 10px #e67e22;
    }
    
    .button-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      padding: 0 10px;
    }
    
    button {
      background: linear-gradient(145deg, #8e44ad, #9b59b6);
      border: none;
      border-radius: 5px;
      color: #ecf0f1;
      font-size: 1rem;
      font-weight: bold;
      padding: 15px 20px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      min-width: 160px;
      flex: 1;
    }
    
    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px #8e44ad;
    }
    
    button.button-glow {
      box-shadow: 0 0 20px rgba(241, 196, 15, 1), inset 0 0 15px rgba(243, 156, 18, 0.8);
    }
    
    button:active {
      transform: scale(0.95);
      box-shadow: 0 0 5px #7d3c98;
    }
    
    textarea {
      width: 90%;
      height: 600px;
      background: rgba(52, 73, 94, 0.6);
      color: #f1c40f;
      border: 1px solid #95a5a6;
      border-radius: 5px;
      font-size: 1rem;
      font-family: 'Creepster', cursive;
      margin: 0 auto 20px auto;
      display: block;
      padding: 10px;
      box-shadow: inset 0 0 10px rgba(241, 196, 15, 0.7), 0 0 10px rgba(241, 196, 15, 0.5);
      backdrop-filter: blur(8px);
      resize: none;
      box-sizing: border-box;
    }
    
    textarea:focus {
      outline: none;
      border-color: #f39c12;
      box-shadow: 0 0 15px rgba(243, 156, 18, 0.8), inset 0 0 15px rgba(243, 156, 18, 0.6);
    }
    
    textarea.expanding {
      animation: glow 0.3s ease-in-out, fadeIn 0.5s ease-in-out;
    }
    
    @keyframes glow {
      0% {
        box-shadow: 0 0 15px rgba(243, 156, 18, 0.8), inset 0 0 15px rgba(243, 156, 18, 0.6);
      }
      50% {
        box-shadow: 0 0 25px rgba(243, 156, 18, 1), inset 0 0 20px rgba(243, 156, 18, 0.8);
      }
      100% {
        box-shadow: 0 0 15px rgba(243, 156, 18, 0.8), inset 0 0 15px rgba(243, 156, 18, 0.6);
      }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      button {
        font-size: 0.9rem;
        padding: 10px 15px;
      }
    }
    
    @media (max-width: 600px) {
      .button-container {
        flex-direction: column;
      }
      button {
        width: 100%;
        min-width: unset;
      }
    }
    </style>

      function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function getRandomItems(arr, count) {
        const shuffled = [...arr].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
      }

      function generateSector() {
        const sector = sector_types[getRandomInt(1, 6)];
        const conflict1 = conflicts[getRandomInt(1, 6)];
        const reason = conflicts_reasons[getRandomInt(1, 6)];
        const conflict2 = conflicts[getRandomInt(1, 6)];

        let traffic1, traffic2;
        if (
          [
            "Нежилые территории (парк или заброшенные здания)",
            "Промзона (заводы, обслуживающая инфраструктура)",
          ].includes(sector)
        ) {
          traffic1 = traffic_non_residential1[getRandomInt(1, 6)];
          traffic2 = traffic_non_residential2[getRandomInt(1, 6)];
        } else if (
          ["Даунтаун", "Застраивающийся/перестраивающийся район"].includes(
            sector
          )
        ) {
          traffic1 = traffic_downtown1[getRandomInt(1, 6)];
          traffic2 = traffic_downtown2[getRandomInt(1, 6)];
        } else {
          traffic1 = traffic_residential1[getRandomInt(1, 6)];
          traffic2 = traffic_residential2[getRandomInt(1, 6)];
        }

        const sectorEvent1 = event1[getRandomInt(1, 6)];
        const sectorEvent2 = event2[getRandomInt(1, 6)];

        const selectedBuildings = getRandomItems(
          buildings,
          getRandomInt(2, 12)
        ).join("; ");
        const selectedStreetsEvents = getRandomItems(
          streets_event,
          getRandomInt(1, 6)
        ).join("; ");
        const selectedcitiesFeatures = getRandomItems(
          citiesFeatures,
          getRandomInt(1, 6)
        ).join("; ");

        const result = `Тип сектора:
${sector}

Событие в секторе:
${sectorEvent1}, что приводит к ${sectorEvent2}.

Конфликт в секторе:
${conflict1} против ${conflict2} (Повод: ${reason}).

Текущий уровень пробок: ${traffic1}. 
Количество людей на улице: ${traffic2}.
Особенности сектора: ${selectedcitiesFeatures}.

Здания в секторе: ${selectedBuildings}

Случайные события в секторе: ${selectedStreetsEvents}`;

        document.getElementById("result").value = result;
      }

      function generateBuilding() {
        const feature = getRandomItems(building_features, 1).join("; ");
        const buildingStyle = styles[getRandomInt(0, 5)];
        const buildingCondition = conditions[getRandomInt(0, 5)];
        const buildingFeature = unusualFeatures[getRandomInt(0, 5)];
        const buildingSecret = secrets[getRandomInt(0, 5)];

        const result = `Оссобенность здания: ${feature}.
Стиль: ${buildingStyle}.
Состояние: ${buildingCondition}.
Особенность: ${buildingFeature}. 
Секрет: ${buildingSecret}.`;

        document.getElementById("result").value = result;
      }

      function generateQuest() {
        typeOfQuest = getRandomInt(1, 2);
        const questClient = getRandomItems(clients, 1).join("; ");
        const questDesire = getRandomItems(desires, 1).join("; ");
        let questAction, questGoal;
        if (typeOfQuest === 1) {
          questAction = getRandomItems(actions1, 1).join("; ");
          questGoal = getRandomItems(goals1, 1).join("; ");
        } else {
          questAction = getRandomItems(actions2, 1).join("; ");
          questGoal = getRandomItems(goals2, 1).join("; ");
        }
        const questObjectives = getRandomItems(objectives, 3).join("; ");
        const questItem = getRandomItems(questitems, 1).join("; ");
        const result = `Клиент: ${questClient}.
Желание: ${questDesire}.
Действие: ${questAction}.
Цель: ${questGoal}.
Задачи: ${questObjectives}.
Награда: ${questItem}`;

        document.getElementById("result").value = result;
      }

      // Функция для случайного выбора нескольких уникальных элементов из массива
      function getRandomElements(array, count) {
        const result = [];
        const tempArray = [...array]; // Создаем копию массива, чтобы не изменять оригинальный массив

        for (let i = 0; i < count; i++) {
          const randomIndex = Math.floor(Math.random() * tempArray.length);
          result.push(tempArray[randomIndex]);
          tempArray.splice(randomIndex, 1); // Удаляем выбранный элемент из временного массива, чтобы избежать повторений
        }

        return result;
      }

        const animal = getRandomElement(animals);

        const tactics = getRandomElements(monsterTactics, 3).join(", ");

        const weakness = getRandomElement(monsterWeakness);

        const monster = {
          животное: animal,
          тело: body,
          особенность: feature,
          тактика: tactics,
          личность: personality,
          способности: abilities,
          слабость: weakness,
        };

        const result = `

Особенность: ${monster.особенность}

  `;

      function getRandomElement(array) {
        return array[Math.floor(Math.random() * array.length)];

      function generateCharacter() {
        const profession1 = getRandomElement(professions);
        let profession2;
        do {
          profession2 = getRandomElement(professions);
        } while (profession1.name === profession2.name);

        const uniqueSkills = new Set([profession1.skill, profession2.skill]);

        while (uniqueSkills.size < 5) {
          let randomSkill = getRandomElement(Skills);

          // Проверяем, если этого элемента ещё нет в множестве
          if (!uniqueSkills.has(randomSkill)) {
            uniqueSkills.add(randomSkill);
          }
        }

        const character = {
          телосложение: getRandomElement(телосложение),
          лицо: getRandomElement(лицо),
          кожа: getRandomElement(кожа),
          волосы: getRandomElement(волосы),
          одежда: getRandomElement(одежда),
          добродетель: getRandomElement(добродетель),
          порок: getRandomElement(порок),
          речь: getRandomElement(речь),
          несчастье: getRandomElement(несчастье),
          профессии: [profession1, profession2],
          скилы: Array.from(uniqueSkills),
          имя: getRandomElement(names),
          имя2: getRandomElement(femaleNames),
        };

        const result = `
Имя: ${character.имя}/${character.имя2}

---Внешний вид---
Телосложение: ${character.телосложение}
Лицо: ${character.лицо}
Кожа: ${character.кожа}
Волосы: ${character.волосы}
Одежда: ${character.одежда}

---Личность---
Добродетель: ${character.добродетель}
Порок: ${character.порок}
Речь: ${character.речь}
Несчастье: ${character.несчастье}

---Предыстория---
Профессия 1: ${character.профессии[0].name}
Профессия 2: ${character.профессии[1].name}
Инвентарь: ${character.профессии[0].items.join(
          ", "
        )}, ${character.профессии[1].items.join(", ")}

Навыки: ${character.профессии[0].skill}, ${character.профессии[1].skill}. 
Дополнительные навыки: ${character.скилы.slice(2).join(", ")}.
            `;

        document.getElementById("result").value = result.trim();
      }

      function rollDice(max) {
        return Math.floor(Math.random() * max) + 1;
      }

      // Функция для генерации локации
      function generateLocation() {
        // Генерация названия локации
        const place = places[Math.floor(Math.random() * places.length)];
        const adjective =
          adjectives[Math.floor(Math.random() * adjectives.length)];
        const noun = nouns[Math.floor(Math.random() * nouns.length)];
        const locationName = `${adjective} ${noun} ${place}`;

        // Генерация мест на локации
        let placesOnLocation = "";
        const numPlaces = rollDice(6);
        for (let i = 0; i < numPlaces; i++) {
          const adjective2 =
            adjectives2[Math.floor(Math.random() * adjectives2.length)];
          const noun2 = nouns2[Math.floor(Math.random() * nouns2.length)];
          placesOnLocation += `${i + 1}. ${adjective2} ${noun2}\n`;
        }

        // Генерация особенностей локации
        let locationFeatures = "";
        const numFeatures = rollDice(6);
        for (let i = 0; i < numFeatures; i++) {
          const feature =
            locations_features[
              Math.floor(Math.random() * locations_features.length)
            ];
          locationFeatures += `${i + 1}. ${feature}\n`;
        }

        // Выбор дополнительной детали
        const additionalDetail =
          additionalDetails[
            Math.floor(Math.random() * additionalDetails.length)
          ];

        // Выбор особенности флоры и фауны
        const floraAndFauna =
          floraAndFaunaFeatures[
            Math.floor(Math.random() * floraAndFaunaFeatures.length)
          ];

        // Сборка всего текста вместе
        const resultText = `Локация: ${locationName}\n\nМеста:\n${placesOnLocation}\nОсобенности:\n${locationFeatures}\n\nДополнительная деталь: ${additionalDetail}\nОсобенности флоры и фауны (если есть): ${floraAndFauna}`;

        // Вывод результата в текстовое поле
        document.getElementById("result").value = resultText;
      }
